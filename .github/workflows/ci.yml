name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No package yet (bootstrap commit) → nothing to test; once pyproject.toml
      # exists, install and tests must pass — no `|| true`.
      - name: Install
        if: hashFiles('pyproject.toml') != ''
        run: pip install -e ".[dev]" pytest
      - name: Test
        if: hashFiles('pyproject.toml') != ''
        run: pytest -q
